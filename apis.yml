aid: tribune-media
name: Tribune Media
description: >-
  Tribune Media was a diversified media and entertainment company with broadcasting, digital, and content businesses.
  Through Tribune Media Services (TMS), it provided comprehensive entertainment data APIs including TV programming,
  movie showtimes, celebrity information, and sports data. Tribune Media was acquired by Nexstar Media Group in 2019.
  The TMS OnConnect APIs are now operated by Gracenote (a Nielsen company), providing metadata for TV shows, movies,
  celebrities, and televised sports to consumer electronics manufacturers, cable operators, entertainment platforms, and
  application developers.
