openapi: 3.0.3
info:
  title: TMS OnConnect API
  description: >-
    The Tribune Media Services (TMS) OnConnect API provides comprehensive entertainment
    metadata for TV programming, movies, celebrities, and sports. It delivers electronic
    programming guide (EPG) data, movie showtimes, celebrity information, and televised
    sports schedules. Originally developed by Tribune Media Services, the API is now
    operated by Gracenote (a Nielsen company) and powers content discovery for consumer
    electronics manufacturers, cable operators, and entertainment platforms.
  version: 1.1.0
  contact:
    url: https://developer.tmsapi.com/
  termsOfService: https://developer.tmsapi.com/page/API_Terms_of_Use
servers:
  - url: https://data.tmsapi.com
    description: TMS OnConnect API server
security:
  - apiKey: []
paths:
  /v1.1/lineups:
    get:
      operationId: getLineups
      summary: Get Lineups by Postal Code
      description: Returns a list of lineups for a country and postal code.
      tags:
        - Lineups
      parameters:
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Two-letter country code (e.g., US, CA)
        - name: postalCode
          in: query
          required: true
          schema:
            type: string
          description: Postal or ZIP code to look up lineups for
        - name: api_key
          in: query
          required: true
          schema:
            type: string
          description: Your TMS API key
      responses:
        '200':
          description: Successful response with list of lineups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lineup'
        '401':
          description: Unauthorized - invalid or missing API key
        '404':
          description: No lineups found for the given postal code

  /v1.1/lineups/{lineupId}:
    get:
      operationId: getLineupById
      summary: Get Lineup Details
      description: Retrieves details for a specific lineup by ID.
      tags:
        - Lineups
      parameters:
        - name: lineupId
          in: path
          required: true
          schema:
            type: string
          description: Unique lineup identifier
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lineup details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lineup'
        '404':
          description: Lineup not found

  /v1.1/lineups/{lineupId}/channels:
    get:
      operationId: getLineupChannels
      summary: Get Lineup Channels
      description: Lists all stations and channels for a given lineup.
      tags:
        - Lineups
      parameters:
        - name: lineupId
          in: path
          required: true
          schema:
            type: string
        - name: imageSize
          in: query
          schema:
            type: string
            enum: [Sm, Md, Lg, Ms]
          description: Size of station images to include
        - name: enhancedCallSign
          in: query
          schema:
            type: boolean
          description: Include enhanced call sign data
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of channels for the lineup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'

  /v1.1/lineups/{lineupId}/grid:
    get:
      operationId: getLineupGrid
      summary: Get TV Grid Schedule
      description: Returns the TV grid schedule for a lineup (up to 6 hours, 14 days advance).
      tags:
        - Lineups
      parameters:
        - name: lineupId
          in: path
          required: true
          schema:
            type: string
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start date/time in ISO 8601 format
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: stationId
          in: query
          schema:
            type: string
          description: Filter to a specific station
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TV grid schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GridEntry'

  /v1.1/stations/search:
    get:
      operationId: searchStations
      summary: Search TV Stations
      description: Searches TV stations by name or call sign.
      tags:
        - Stations
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (station name or call sign)
        - name: queryFields
          in: query
          schema:
            type: string
          description: Fields to search (e.g., name, callSign)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'

  /v1.1/stations/{stationId}:
    get:
      operationId: getStationById
      summary: Get Station Details
      description: Retrieves details for a specific TV station.
      tags:
        - Stations
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          schema:
            type: string
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Station details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'

  /v1.1/stations/{stationId}/airings:
    get:
      operationId: getStationAirings
      summary: Get Station Schedule
      description: Returns the schedule for a single station (up to 14 days ahead).
      tags:
        - Stations
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          schema:
            type: string
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Station airing schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airing'

  /v1.1/programs/search:
    get:
      operationId: searchPrograms
      summary: Search Programs
      description: Returns basic program metadata based on free-form search criteria.
      tags:
        - Programs
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Free-form search query
        - name: queryFields
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
            enum: [movie, show, special, sports, episode]
        - name: genres
          in: query
          schema:
            type: string
        - name: subType
          in: query
          schema:
            type: string
        - name: includeAdult
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: lineupId
          in: query
          schema:
            type: string
        - name: startDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'

  /v1.1/programs/genres:
    get:
      operationId: getProgramGenres
      summary: Get Program Genres
      description: Returns a list of program genres, to be used in conjunction with Program Search.
      tags:
        - Programs
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'

  /v1.1/programs/newShowAirings:
    get:
      operationId: getNewShowAirings
      summary: Get New Show Airings
      description: Retrieves shows and episodes airing new on a lineup (up to 24 hours, 14 days advance).
      tags:
        - Programs
      parameters:
        - name: lineupId
          in: query
          required: true
          schema:
            type: string
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: includeAdult
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New show airings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airing'

  /v1.1/programs/{tmsId}:
    get:
      operationId: getProgramById
      summary: Get Program Details
      description: Retrieves detailed metadata for a specific program by TMS ID.
      tags:
        - Programs
      parameters:
        - name: tmsId
          in: path
          required: true
          schema:
            type: string
          description: TMS program identifier
        - name: imageSize
          in: query
          schema:
            type: string
        - name: imageAspectTV
          in: query
          schema:
            type: string
        - name: imageText
          in: query
          schema:
            type: boolean
        - name: market
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Program details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'

  /v1.1/programs/{tmsId}/airings:
    get:
      operationId: getProgramAirings
      summary: Get Program Airings
      description: Returns all airings of a specific program (up to 14 days advance).
      tags:
        - Programs
      parameters:
        - name: tmsId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          schema:
            type: string
        - name: startDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: includeDetail
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Program airings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airing'

  /v1.1/series/{seriesId}:
    get:
      operationId: getSeriesById
      summary: Get Series Details
      description: Returns detailed metadata for a specific TV series.
      tags:
        - Series
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
        - name: imageSize
          in: query
          schema:
            type: string
        - name: titleLang
          in: query
          schema:
            type: string
        - name: descriptionLang
          in: query
          schema:
            type: string
        - name: market
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Series details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'

  /v1.1/series/{seriesId}/airings:
    get:
      operationId: getSeriesAirings
      summary: Get Series Airings
      description: Retrieves all airings for a TV series (up to 14 days advance).
      tags:
        - Series
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          schema:
            type: string
        - name: startDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: includeDetail
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Series airings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airing'

  /v1.1/series/{seriesId}/episodes:
    get:
      operationId: getSeriesEpisodes
      summary: Get Series Episodes
      description: Returns episodes for a series sorted by season and episode number.
      tags:
        - Series
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
        - name: season
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Series episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Episode'

  /v1.1/movies/airings:
    get:
      operationId: getMovieAirings
      summary: Get Movies Airing on TV
      description: Provides movies airing on a lineup (up to 24 hours, 14 days advance).
      tags:
        - Movies
      parameters:
        - name: lineupId
          in: query
          required: true
          schema:
            type: string
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: includeAdult
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: imageText
          in: query
          schema:
            type: boolean
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movies airing on TV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieAiring'

  /v1.1/movies/showings:
    get:
      operationId: getMovieShowings
      summary: Get Movies in Theatres
      description: Returns movies currently playing in local theatres with showtimes.
      tags:
        - Movies
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: numDays
          in: query
          schema:
            type: integer
            default: 1
        - name: zip
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
            format: float
        - name: lng
          in: query
          schema:
            type: number
            format: float
        - name: radius
          in: query
          schema:
            type: integer
            default: 10
        - name: units
          in: query
          schema:
            type: string
            enum: [mile, km]
            default: mile
        - name: imageSize
          in: query
          schema:
            type: string
        - name: market
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movies currently in theatres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieShowing'

  /v1.1/theatres:
    get:
      operationId: getTheatres
      summary: Get Theatres by Location
      description: Retrieves theatre locations via zip/postal code or geographic coordinates.
      tags:
        - Theatres
      parameters:
        - name: zip
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
            format: float
        - name: lng
          in: query
          schema:
            type: number
            format: float
        - name: radius
          in: query
          schema:
            type: integer
            default: 10
        - name: units
          in: query
          schema:
            type: string
            enum: [mile, km]
            default: mile
        - name: numTheatres
          in: query
          schema:
            type: integer
            default: 10
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of nearby theatres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theatre'

  /v1.1/theatres/{theatreId}/showings:
    get:
      operationId: getTheatreShowings
      summary: Get Theatre Showtimes
      description: Lists movies and showtimes at a specific theatre.
      tags:
        - Theatres
      parameters:
        - name: theatreId
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: numDays
          in: query
          schema:
            type: integer
            default: 1
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Theatre showtimes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Showing'

  /v1.1/movies/{movieId}/showings:
    get:
      operationId: getMovieShowtimes
      summary: Get Movie Showtimes
      description: Returns metadata and theatre/showtime information for a specific movie.
      tags:
        - Movies
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: numDays
          in: query
          schema:
            type: integer
            default: 1
        - name: zip
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
            format: float
        - name: lng
          in: query
          schema:
            type: number
            format: float
        - name: radius
          in: query
          schema:
            type: integer
            default: 10
        - name: units
          in: query
          schema:
            type: string
            enum: [mile, km]
            default: mile
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movie showtimes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieShowing'

  /v1.1/sports/{sportsId}:
    get:
      operationId: getSportById
      summary: Get Sport Details
      description: Returns sport details with optional organization information.
      tags:
        - Sports
      parameters:
        - name: sportsId
          in: path
          required: true
          schema:
            type: string
        - name: includeOrg
          in: query
          schema:
            type: boolean
        - name: officialOrg
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sport details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sport'

  /v1.1/sports/{sportsId}/events/airings:
    get:
      operationId: getSportEventAirings
      summary: Get Sports Event Airings
      description: Returns live sports events for specified sports on a lineup.
      tags:
        - Sports
      parameters:
        - name: sportsId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          required: true
          schema:
            type: string
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: liveOnly
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sports event airings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportsAiring'

  /v1.1/sports/{sportsId}/non-events/airings:
    get:
      operationId: getSportNonEventAirings
      summary: Get Sports Non-Event Airings
      description: Returns sports non-events and taped events (24 hours, 14 days advance).
      tags:
        - Sports
      parameters:
        - name: sportsId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          required: true
          schema:
            type: string
        - name: startDateTime
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sports non-event airings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airing'

  /v1.1/sports/organizations/{organizationId}/airings:
    get:
      operationId: getOrganizationAirings
      summary: Get Organization Airings
      description: Returns all airings for a sports organization (e.g., MLB, NBA, NFL).
      tags:
        - Sports
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: lineupId
          in: query
          schema:
            type: string
        - name: startDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endDateTime
          in: query
          schema:
            type: string
            format: date-time
        - name: includeDetail
          in: query
          schema:
            type: boolean
        - name: imageSize
          in: query
          schema:
            type: string
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization airings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportsAiring'

  /v1.1/sports/teams/{teamBrandId}/airings:
    get:
      operationId: getTeamAirings
      summary: Get Team Airings
      description: Returns all airings for a sports team.
      tags:
