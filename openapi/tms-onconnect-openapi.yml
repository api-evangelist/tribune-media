components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: api_key
  schemas:
    Lineup:
      type: object
      properties:
        lineupId:
          type: string
          description: Unique lineup identifier
        name:
          type: string
          description: Lineup display name
        type:
          type: string
          description: Lineup type (e.g., cable, satellite, ota)
        location:
          type: string
          description: Geographic location of the lineup
        device:
          type: string
          description: Device or service type
        postalCode:
          type: string
          description: Associated postal code
        country:
          type: string
          description: Country code

    Channel:
      type: object
      properties:
        stationId:
          type: string
        channel:
          type: string
        callSign:
          type: string
        name:
          type: string
        preferredImage:
          $ref: '#/components/schemas/Image'

    Station:
      type: object
      properties:
        stationId:
          type: string
          description: Unique station identifier
        callSign:
          type: string
          description: Station call sign (e.g., WNBC)
        name:
          type: string
          description: Station name
        type:
          type: string
          description: Station type
        city:
          type: string
        state:
          type: string
        country:
          type: string
        preferredImage:
          $ref: '#/components/schemas/Image'

    Program:
      type: object
      properties:
        tmsId:
          type: string
          description: TMS program identifier
        rootId:
          type: string
        seriesId:
          type: string
        title:
          type: string
          description: Program title
        titleLang:
          type: string
        description:
          type: string
          description: Program description
        shortDescription:
          type: string
        entityType:
          type: string
          enum: [Movie, Show, Special, Sports, Episode]
        subType:
          type: string
        genres:
          type: array
          items:
            type: string
        releaseYear:
          type: integer
        releaseDate:
          type: string
          format: date
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        preferredImage:
          $ref: '#/components/schemas/Image'

    Series:
      type: object
      properties:
        seriesId:
          type: string
          description: Unique series identifier
        title:
          type: string
          description: Series title
        description:
          type: string
          description: Series description
        startAirDate:
          type: string
          format: date
        endAirDate:
          type: string
          format: date
        genres:
          type: array
          items:
            type: string
        preferredImage:
          $ref: '#/components/schemas/Image'

    Episode:
      type: object
      properties:
        tmsId:
          type: string
        seriesId:
          type: string
        title:
          type: string
        episodeTitle:
          type: string
        description:
          type: string
        seasonNum:
          type: integer
        episodeNum:
          type: integer
        airDate:
          type: string
          format: date
        preferredImage:
          $ref: '#/components/schemas/Image'

    Movie:
      type: object
      properties:
        tmsId:
          type: string
          description: TMS movie identifier
        rootId:
          type: string
        title:
          type: string
        description:
          type: string
        releaseYear:
          type: integer
        releaseDate:
          type: string
          format: date
        genres:
          type: array
          items:
            type: string
        runTime:
          type: string
          description: Runtime in ISO 8601 duration format
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        preferredImage:
          $ref: '#/components/schemas/Image'

    Theatre:
      type: object
      properties:
        theatreId:
          type: string
          description: Unique theatre identifier
        name:
          type: string
          description: Theatre name
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        distance:
          type: number
          format: float
          description: Distance from search origin

    Airing:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          description: Airing start time in ISO 8601 format
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
        stationId:
          type: string
        qualifiers:
          type: array
          items:
            type: string
          description: Qualifiers such as New, Live, Finale, Repeat
        program:
          $ref: '#/components/schemas/Program'

    GridEntry:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
        channel:
          type: string
        stationId:
          type: string
        qualifiers:
          type: array
          items:
            type: string
        program:
          $ref: '#/components/schemas/Program'

    MovieAiring:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
        stationId:
          type: string
        movie:
          $ref: '#/components/schemas/Movie'

    MovieShowing:
      type: object
      properties:
        movie:
          $ref: '#/components/schemas/Movie'
        theatres:
          type: array
          items:
            $ref: '#/components/schemas/Theatre'
        showtimes:
          type: array
          items:
            $ref: '#/components/schemas/Showing'

    Showing:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        movieId:
          type: string
        theatreId:
          type: string
        format:
          type: string
          description: Format (e.g., 3D, IMAX, Standard)

    Sport:
      type: object
      properties:
        sportsId:
          type: string
          description: Unique sport identifier
        name:
          type: string
          description: Sport name
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/SportOrganization'
        preferredImage:
          $ref: '#/components/schemas/Image'

    SportOrganization:
      type: object
      properties:
        organizationId:
          type: string
        name:
          type: string
        abbreviation:
          type: string

    SportsAiring:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
        stationId:
          type: string
        liveEvent:
          type: boolean
        teams:
          type: array
          items:
            type: object
            properties:
              teamBrandId:
                type: string
              name:
                type: string
        program:
          $ref: '#/components/schemas/Program'

    Celebrity:
      type: object
      properties:
        personId:
          type: string
          description: Unique person identifier
        name:
          type: string
          description: Celebrity name
        biography:
          type: string
        birthDate:
          type: string
          format: date
        birthPlace:
          type: string
        preferredImage:
          $ref: '#/components/schemas/Image'

    CelebrityAppearance:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        stationId:
          type: string
        program:
          $ref: '#/components/schemas/Program'
        celebrity:
          $ref: '#/components/schemas/Celebrity'

    Genre:
      type: object
      properties:
        genreId:
          type: string
        name:
          type: string
          description: Genre name

    Rating:
      type: object
      properties:
        body:
          type: string
          description: Rating body (e.g., MPAA, TV Parental Guidelines)
        code:
          type: string
          description: Rating code (e.g., PG-13, TV-14)

    Image:
      type: object
      properties:
        uri:
          type: string
          description: Image URI
        width:
          type: integer
        height:
          type: integer
        primary:
          type: boolean
        category:
          type: string
        text:
          type: boolean

    SocialData:
      type: object
      properties:
        rootId:
          type: string
        seriesId:
          type: string
        socialLinks:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              url:
                type: string
