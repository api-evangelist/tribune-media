naftiko: 1.0.0-alpha2
info:
  label: TMS OnConnect API — Movies
  description: 'TMS OnConnect API — Movies. 3 operations. Lead operation: Get Movies Airing on TV. Self-contained Naftiko
    capability covering one Tribune Media business surface.'
  tags:
  - Tribune Media
  - Movies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRIBUNE_MEDIA_API_KEY: TRIBUNE_MEDIA_API_KEY
capability:
  consumes:
  - type: http
    namespace: tms-onconnect-movies
    baseUri: https://data.tmsapi.com
    description: TMS OnConnect API — Movies business capability. Self-contained, no shared references.
    resources:
    - name: v1.1-movies-airings
      path: /v1.1/movies/airings
      operations:
      - name: getmovieairings
        method: GET
        description: Get Movies Airing on TV
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: lineupId
          in: query
          type: string
          required: true
        - name: startDateTime
          in: query
          type: string
          required: true
        - name: endDateTime
          in: query
          type: string
        - name: includeAdult
          in: query
          type: boolean
        - name: imageSize
          in: query
          type: string
        - name: imageText
          in: query
          type: boolean
        - name: api_key
          in: query
          type: string
          required: true
    - name: v1.1-movies-showings
      path: /v1.1/movies/showings
      operations:
      - name: getmovieshowings
        method: GET
        description: Get Movies in Theatres
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
          required: true
        - name: numDays
          in: query
          type: integer
        - name: zip
          in: query
          type: string
        - name: lat
          in: query
          type: number
        - name: lng
          in: query
          type: number
        - name: radius
          in: query
          type: integer
        - name: units
          in: query
          type: string
        - name: imageSize
          in: query
          type: string
        - name: market
          in: query
          type: string
        - name: api_key
          in: query
          type: string
          required: true
    - name: v1.1-movies-movieId-showings
      path: /v1.1/movies/{movieId}/showings
      operations:
      - name: getmovieshowtimes
        method: GET
        description: Get Movie Showtimes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: movieId
          in: path
          type: string
          required: true
        - name: startDate
          in: query
          type: string
          required: true
        - name: numDays
          in: query
          type: integer
        - name: zip
          in: query
          type: string
        - name: lat
          in: query
          type: number
        - name: lng
          in: query
          type: number
        - name: radius
          in: query
          type: integer
        - name: units
          in: query
          type: string
        - name: imageSize
          in: query
          type: string
        - name: api_key
          in: query
          type: string
          required: true
    authentication:
      type: apikey
      key: api_key
      value: '{{env.TRIBUNE_MEDIA_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: tms-onconnect-movies-rest
    port: 8080
    description: REST adapter for TMS OnConnect API — Movies. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1-1/movies/airings
      name: v1-1-movies-airings
      description: REST surface for v1.1-movies-airings.
      operations:
      - method: GET
        name: getmovieairings
        description: Get Movies Airing on TV
        call: tms-onconnect-movies.getmovieairings
        with:
          lineupId: rest.lineupId
          startDateTime: rest.startDateTime
          endDateTime: rest.endDateTime
          includeAdult: rest.includeAdult
          imageSize: rest.imageSize
          imageText: rest.imageText
          api_key: rest.api_key
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1-1/movies/showings
      name: v1-1-movies-showings
      description: REST surface for v1.1-movies-showings.
      operations:
      - method: GET
        name: getmovieshowings
        description: Get Movies in Theatres
        call: tms-onconnect-movies.getmovieshowings
        with:
          startDate: rest.startDate
          numDays: rest.numDays
          zip: rest.zip
          lat: rest.lat
          lng: rest.lng
          radius: rest.radius
          units: rest.units
          imageSize: rest.imageSize
          market: rest.market
          api_key: rest.api_key
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1-1/movies/{movieid}/showings
      name: v1-1-movies-movieid-showings
      description: REST surface for v1.1-movies-movieId-showings.
      operations:
      - method: GET
        name: getmovieshowtimes
        description: Get Movie Showtimes
        call: tms-onconnect-movies.getmovieshowtimes
        with:
          movieId: rest.movieId
          startDate: rest.startDate
          numDays: rest.numDays
          zip: rest.zip
          lat: rest.lat
          lng: rest.lng
          radius: rest.radius
          units: rest.units
          imageSize: rest.imageSize
          api_key: rest.api_key
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tms-onconnect-movies-mcp
    port: 9090
    transport: http
    description: MCP adapter for TMS OnConnect API — Movies. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-movies-airing-tv
      description: Get Movies Airing on TV
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tms-onconnect-movies.getmovieairings
      with:
        lineupId: tools.lineupId
        startDateTime: tools.startDateTime
        endDateTime: tools.endDateTime
        includeAdult: tools.includeAdult
        imageSize: tools.imageSize
        imageText: tools.imageText
        api_key: tools.api_key
      outputParameters:
      - type: object
        mapping: $.
    - name: get-movies-theatres
      description: Get Movies in Theatres
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tms-onconnect-movies.getmovieshowings
      with:
        startDate: tools.startDate
        numDays: tools.numDays
        zip: tools.zip
        lat: tools.lat
        lng: tools.lng
        radius: tools.radius
        units: tools.units
        imageSize: tools.imageSize
        market: tools.market
        api_key: tools.api_key
      outputParameters:
      - type: object
        mapping: $.
    - name: get-movie-showtimes
      description: Get Movie Showtimes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tms-onconnect-movies.getmovieshowtimes
      with:
        movieId: tools.movieId
        startDate: tools.startDate
        numDays: tools.numDays
        zip: tools.zip
        lat: tools.lat
        lng: tools.lng
        radius: tools.radius
        units: tools.units
        imageSize: tools.imageSize
        api_key: tools.api_key
      outputParameters:
      - type: object
        mapping: $.
