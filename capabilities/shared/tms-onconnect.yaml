naftiko: "1.0.0-alpha1"

info:
  label: "TMS OnConnect API"
  description: >-
    Tribune Media Services OnConnect API providing comprehensive entertainment metadata
    for TV programming, movies, celebrities, and sports. Delivers EPG data, movie
    showtimes, celebrity information, and sports schedules.
  tags:
    - Entertainment
    - Television
    - Movies
    - Sports
    - Celebrity
    - Programming Guide
    - Media
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TMS_API_KEY: TMS_API_KEY

capability:
  consumes:
    - type: http
      namespace: tms-onconnect
      baseUri: https://data.tmsapi.com
      description: "TMS OnConnect entertainment metadata API"
      authentication:
        type: apikey
        key: api_key
        value: "{{TMS_API_KEY}}"
        placement: query
      resources:
        - name: lineups
          path: /v1.1/lineups
          description: TV lineup management and channel listings
          operations:
            - name: get-lineups
              method: GET
              description: Get lineups by postal code
              inputParameters:
                - name: postalCode
                  in: query
                  type: string
                  required: true
                  description: ZIP or postal code for lineup lookup
                - name: country
                  in: query
                  type: string
                  required: false
                  description: Two-letter country code
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-lineup-channels
              method: GET
              description: Get channels for a specific lineup
              inputParameters:
                - name: lineupId
                  in: path
                  type: string
                  required: true
                  description: Lineup identifier
                - name: imageSize
                  in: query
                  type: string
                  required: false
                  description: Image size
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-lineup-grid
              method: GET
              description: Get TV grid schedule for lineup
              inputParameters:
                - name: lineupId
                  in: path
                  type: string
                  required: true
                  description: Lineup identifier
                - name: startDateTime
                  in: query
                  type: string
                  required: true
                  description: Grid start time (ISO 8601)
                - name: endDateTime
                  in: query
                  type: string
                  required: false
                  description: Grid end time (ISO 8601)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: programs
          path: /v1.1/programs
          description: TV program search and metadata
          operations:
            - name: search-programs
              method: GET
              description: Search programs by free-form query
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: Search query
                - name: entityType
                  in: query
                  type: string
                  required: false
                  description: Filter by entity type (movie, show, special, sports)
                - name: genres
                  in: query
                  type: string
                  required: false
                  description: Filter by genres
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Maximum results
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: Pagination offset
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-program
              method: GET
              description: Get detailed metadata for a program
              inputParameters:
                - name: tmsId
                  in: path
                  type: string
                  required: true
                  description: TMS program identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-program-airings
              method: GET
              description: Get all airings for a program
              inputParameters:
                - name: tmsId
                  in: path
                  type: string
                  required: true
                  description: TMS program identifier
                - name: lineupId
                  in: query
                  type: string
                  required: false
                  description: Lineup to search
                - name: startDateTime
                  in: query
                  type: string
                  required: false
                  description: Start time for airings
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-new-show-airings
              method: GET
              description: Get new show airings on a lineup
              inputParameters:
                - name: lineupId
                  in: query
                  type: string
                  required: true
                  description: Lineup identifier
                - name: startDateTime
                  in: query
                  type: string
                  required: true
                  description: Start time
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-program-genres
              method: GET
              description: Get list of program genres
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: movies
          path: /v1.1/movies
          description: Movie showtime and airing information
          operations:
            - name: get-movie-showings
              method: GET
              description: Get movies in local theatres with showtimes
              inputParameters:
                - name: startDate
                  in: query
                  type: string
                  required: true
                  description: Start date for showings
                - name: zip
                  in: query
                  type: string
                  required: false
                  description: ZIP code for location
                - name: lat
                  in: query
                  type: number
                  required: false
                  description: Latitude coordinate
                - name: lng
                  in: query
                  type: number
                  required: false
                  description: Longitude coordinate
                - name: radius
                  in: query
                  type: integer
                  required: false
                  description: Search radius
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-movie-airings
              method: GET
              description: Get movies airing on TV lineup
              inputParameters:
                - name: lineupId
                  in: query
                  type: string
                  required: true
                  description: Lineup identifier
                - name: startDateTime
                  in: query
                  type: string
                  required: true
                  description: Start time for airing window
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-movie-showtimes
              method: GET
              description: Get showtimes for a specific movie
              inputParameters:
                - name: movieId
                  in: path
                  type: string
                  required: true
                  description: Movie identifier
                - name: startDate
                  in: query
                  type: string
                  required: true
                  description: Start date
                - name: zip
                  in: query
                  type: string
                  required: false
                  description: ZIP code
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: sports
          path: /v1.1/sports
          description: Sports event and team information
          operations:
            - name: get-sport
              method: GET
              description: Get sport details with organizations
              inputParameters:
                - name: sportsId
                  in: path
                  type: string
                  required: true
                  description: Sport identifier
                - name: includeOrg
                  in: query
                  type: boolean
                  required: false
                  description: Include organization details
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-sport-event-airings
              method: GET
              description: Get live sports events on a lineup
              inputParameters:
                - name: sportsId
                  in: path
                  type: string
                  required: true
                  description: Sport identifier
                - name: lineupId
                  in: query
                  type: string
                  required: true
                  description: Lineup to search
                - name: startDateTime
                  in: query
                  type: string
                  required: true
                  description: Start time
                - name: liveOnly
                  in: query
                  type: boolean
                  required: false
                  description: Filter to live events only
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-organization-airings
              method: GET
              description: Get airings for a sports organization
              inputParameters:
                - name: organizationId
                  in: path
                  type: string
                  required: true
                  description: Organization identifier
                - name: lineupId
                  in: query
                  type: string
                  required: false
                  description: Lineup identifier
                - name: startDateTime
                  in: query
                  type: string
                  required: false
                  description: Start time
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-team-airings
              method: GET
              description: Get airings for a specific sports team
              inputParameters:
                - name: teamBrandId
                  in: path
                  type: string
                  required: true
                  description: Team brand identifier
                - name: lineupId
                  in: query
                  type: string
                  required: false
                  description: Lineup identifier
                - name: startDateTime
                  in: query
                  type: string
                  required: false
                  description: Start time
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: celebrities
          path: /v1.1/celebs
          description: Celebrity information and TV appearance scheduling
          operations:
            - name: get-celebrity
              method: GET
              description: Get celebrity details
              inputParameters:
                - name: personId
                  in: path
                  type: string
                  required: true
                  description: Person identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-celebrity-airings
              method: GET
              description: Get TV airings featuring a celebrity
              inputParameters:
                - name: personId
                  in: path
                  type: string
                  required: true
                  description: Person identifier
                - name: lineupId
                  in: query
                  type: string
                  required: false
                  description: Lineup to search
                - name: startDateTime
                  in: query
                  type: string
                  required: false
                  description: Start time
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-talk-show-airings
              method: GET
              description: Get celebrity talk show appearances
              inputParameters:
                - name: lineupId
                  in: query
                  type: string
                  required: true
                  description: Lineup identifier
                - name: startDateTime
                  in: query
                  type: string
                  required: true
                  description: Start time
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tms-onconnect-rest
      resources:
        - path: /v1/lineups
          name: lineups
          description: TV lineup lookups
          operations:
            - method: GET
              name: get-lineups
              description: Get lineups by postal code
              call: "tms-onconnect.get-lineups"
              with:
                postalCode: "rest.postalCode"
                country: "rest.country"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/programs
          name: programs
          description: Program search
          operations:
            - method: GET
              name: search-programs
              description: Search programs
              call: "tms-onconnect.search-programs"
              with:
                q: "rest.q"
                entityType: "rest.entityType"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/movies/showings
          name: movie-showings
          description: Movie theatre showings
          operations:
            - method: GET
              name: get-movie-showings
              description: Get movies in local theatres
              call: "tms-onconnect.get-movie-showings"
              with:
                startDate: "rest.startDate"
                zip: "rest.zip"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tms-onconnect-mcp
      transport: http
      tools:
        - name: get-lineups
          description: Get TV lineups for a postal code
          hints:
            readOnly: true
            openWorld: false
          call: "tms-onconnect.get-lineups"
          with:
            postalCode: "tools.postalCode"
            country: "tools.country"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-lineup-grid
          description: Get TV programming grid for a lineup
          hints:
            readOnly: true
            openWorld: false
          call: "tms-onconnect.get-lineup-grid"
          with:
            lineupId: "tools.lineupId"
            startDateTime: "tools.startDateTime"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-programs
          description: Search TV programs and movies by keyword
          hints:
            readOnly: true
            openWorld: true
          call: "tms-onconnect.search-programs"
          with:
            q: "tools.q"
            entityType: "tools.entityType"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-movie-showings
          description: Get movies currently showing in local theatres
          hints:
            readOnly: true
            openWorld: false
          call: "tms-onconnect.get-movie-showings"
          with:
            startDate: "tools.startDate"
            zip: "tools.zip"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-sport-event-airings
          description: Get live sports events airing on a lineup
          hints:
            readOnly: true
            openWorld: false
          call: "tms-onconnect.get-sport-event-airings"
          with:
            sportsId: "tools.sportsId"
            lineupId: "tools.lineupId"
            startDateTime: "tools.startDateTime"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-celebrity-airings
          description: Get TV appearances for a celebrity
          hints:
            readOnly: true
            openWorld: false
          call: "tms-onconnect.get-celebrity-airings"
          with:
            personId: "tools.personId"
            lineupId: "tools.lineupId"
          outputParameters:
            - type: object
              mapping: "$."
